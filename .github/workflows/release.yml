name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    name: Verify exact npm release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.6.1
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck the release source
        if: github.event_name != 'pull_request'
        run: npm run typecheck
      - name: Test the release source
        if: github.event_name != 'pull_request'
        run: npm test
      - name: Build and verify one exact tarball
        run: node scripts/release-artifact.mjs build
      - name: Dry-run publication of that exact tarball
        run: npm publish --dry-run --ignore-scripts --access public ./release-candidate/package.tgz
      - name: Upload tarball, checksum, and build provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish verified tarball with npm OIDC
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/@rachittshah/tasc
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24 for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin OIDC-capable npm
        run: npm install --global npm@11.6.1
      - name: Download the verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-candidate
          path: release-candidate
          digest-mismatch: error
      - name: Reverify tag, commit, checksum, provenance, and tarball
        run: node scripts/release-artifact.mjs verify
      - name: Publish the exact candidate with short-lived OIDC
        shell: bash
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          DIST_TAG="latest"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            DIST_TAG="next"
          fi
          npm publish \
            --ignore-scripts \
            --access public \
            --provenance \
            --tag "$DIST_TAG" \
            ./release-candidate/package.tgz
